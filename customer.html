<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,add_photo_alternate,arrow_back_ios_new,arrow_downward,arrow_upward,block,campaign,cancel,cast,cast_connected,cast_pause,cast_warning,chat,check,check_circle,chevron_left,chevron_right,close,content_copy,delete,done_all,download,edit,error,event,expand_more,fullscreen,group,image,inbox,info,inventory_2,language,link_off,login,logout,near_me,notifications,notifications_active,notifications_off,payments,person_add,point_of_sale,print,progress_activity,qr_code_2,receipt_long,remove,restart_alt,restaurant,restaurant_menu,save,schedule,search,send,settings,shopping_bag,sms,storefront,swap_horiz,sync,timer,tune,tv,undo,upload,view_kanban,visibility,volume_up,warning,zoom_in,zoom_out&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<meta name="robots" content="noindex">
<title>九愛！買｜顧客顯示</title>
<script type="module" src="js/pages/customer.js"></script>
</head>
<body class="cs-body">
  <!-- 顧客顯示頁：不用登入，輸入現場點餐頁顯示的 6 位數配對碼後即時顯示點餐明細 -->
  <main id="cs-pair" class="cs-pair">
    <img class="cs-pair__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
    <form id="pair-form" class="card stack cs-pair__card" novalidate>
      <h1 class="section-title" data-i18n="screen.pinTitle">輸入配對碼</h1>
      <p class="muted text-sm" data-i18n="screen.pinHint">請輸入攤位現場點餐頁顯示的 6 位數配對碼</p>
      <input id="pin-input" class="input cs-pin" name="pin" inputmode="numeric" maxlength="6" autocomplete="off" pattern="[0-9]{6}" placeholder="000000" aria-label="配對碼">
      <p id="pin-error" class="banner banner--solid-danger" hidden></p>
      <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="screen.connect">連線</button>
    </form>
  </main>

  <main id="cs-screen" class="cs-screen" hidden>
    <!-- 待機：橫幅輪播 -->
    <section id="cs-idle" class="cs-idle">
      <div id="cs-banners" class="cs-banners"></div>
      <p id="cs-welcome" class="cs-welcome" data-i18n="screen.welcome">歡迎光臨</p>
    </section>

    <!-- 輪播時才出現的兩個淡色按鈕(約 90% 融入背景)：左下切到叫號、右下中斷連線 -->
    <div id="cs-corner" class="cs-corner" hidden>
      <button id="cs-to-board" class="cs-corner__btn cs-corner__btn--left" type="button" data-i18n-aria="screen.toBoard" aria-label="切換到叫號畫面">
        <span class="material-symbols-rounded icon" aria-hidden="true">tv</span>
      </button>
      <button id="cs-leave" class="cs-corner__btn cs-corner__btn--right" type="button" data-i18n-aria="screen.leave" aria-label="中斷與攤位的連線">
        <span class="material-symbols-rounded icon" aria-hidden="true">cast_pause</span>
      </button>
    </div>

    <!-- 點餐中：左邊明細表格，右邊合計 -->
    <section id="cs-cart" class="cs-cart" hidden>
      <div class="cs-cart__list card">
        <!-- 明細可捲動；捲動時上下緣出現淡陰影，合計固定在最下方 -->
        <div id="cs-scroll" class="cs-cart__scroll">
          <table class="cs-table">
            <thead><tr><th data-i18n="screen.item">品項</th><th class="num" data-i18n="screen.qty">數量</th><th class="num" data-i18n="screen.subtotal">小計</th></tr></thead>
            <tbody id="cs-lines"></tbody>
          </table>
        </div>
        <div class="cs-sum">
          <p id="cs-count" class="cs-sum__count muted"></p>
          <p class="cs-sum__label" data-i18n="screen.total">合計</p>
          <p id="cs-total" class="cs-sum__total display-no"></p>
        </div>
      </div>
      <!-- 右欄：星星底紋 + 首頁同款斜向白底黑框商標帶 -->
      <aside class="cs-cart__brand" aria-hidden="true">
        <div class="cs-brand__pattern"></div>
        <div class="cs-brand__band"><img class="cs-brand__logo" src="assets/brand/logo-band.webp" alt="" width="1910" height="844"></div>
      </aside>
    </section>

    <!-- 結帳後：取餐編號(稍後取餐另顯示追蹤 QR code)，1 分鐘後回到待機 -->
    <section id="cs-done" class="cs-done" hidden>
      <img class="cs-done__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
      <div class="cs-done__row">
        <div class="card cs-done__card">
          <p id="cs-thanks" class="cs-done__thanks" data-i18n="screen.thanks">謝謝光臨</p>
          <p class="muted" data-i18n="screen.no">取餐編號</p>
          <p id="cs-no" class="display-no cs-done__no"></p>
          <p id="cs-paid" class="muted"></p>
        </div>
        <div id="cs-qr-box" class="card cs-done__qr" hidden>
          <div id="cs-qr" class="qr-box"></div>
          <p class="text-sm" data-i18n="screen.scan">掃描 QR code 追蹤進度、開啟取餐通知</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
