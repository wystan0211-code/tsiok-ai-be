<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back_ios_new,arrow_downward,arrow_upward,block,campaign,cancel,chat,check,delete,done_all,download,edit,error,fullscreen,group,image,inbox,info,link_off,login,logout,notifications,notifications_active,payments,person_add,point_of_sale,print,progress_activity,receipt_long,remove,restart_alt,restaurant,restaurant_menu,save,schedule,search,send,settings,shopping_bag,sms,storefront,tune,tv,undo,view_kanban,volume_up,warning&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/core/page-wait-boot.js"></script>
<title>九愛！買｜訂單進度</title>
<script type="module" src="js/pages/track.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" aria-label="回到入口"><img class="topbar__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260"></a>
      <span class="topbar__spacer"></span>
      <span class="topbar__title">訂單進度</span>
    </div>
  </header>

  <main class="page stack">
    <section id="state-loading" class="loading">
      <span class="material-symbols-rounded icon spin" aria-hidden="true">progress_activity</span>
      <span>載入中</span>
    </section>

    <!-- 找回訂單 -->
    <section id="view-find" class="stack flush" hidden>
      <form id="find-form" class="card stack">
        <h2 class="section-title">找回訂單</h2>
        <label class="field">
          <span class="field__label">訂單編號</span>
          <input class="input" name="no" required maxlength="6" placeholder="例如：A012" autocapitalize="characters">
        </label>
        <label class="field">
          <span class="field__label">下單時填寫的手機號碼</span>
          <input class="input" name="phone" type="tel" inputmode="numeric" required maxlength="12" placeholder="09xxxxxxxx">
        </label>
        <p id="find-error" class="banner banner--danger" hidden></p>
        <button class="btn btn--primary btn--block" type="submit">
          <span class="material-symbols-rounded icon" aria-hidden="true">search</span>
          查詢
        </button>
      </form>
      <section id="history" class="card stack" hidden>
        <h2 class="section-title">這台裝置的訂單</h2>
        <div id="history-list" class="stack"></div>
      </section>
    </section>

    <!-- 訂單進度 -->
    <section id="view-order" class="stack flush" hidden>
      <ol id="o-steps" class="steps" aria-label="訂單進度"></ol>

      <div class="card order-hero">
        <p class="muted">訂單編號</p>
        <p id="o-no" class="display-no order-hero__no"></p>
        <p id="o-status" class="order-hero__status"></p>
        <p id="o-eta" class="muted"></p>
      </div>

      <div id="o-alert"></div>

      <section id="o-notify" class="card stack" hidden></section>

      <section id="o-messages-box" class="card stack" hidden>
        <h2 class="section-title">攤位訊息</h2>
        <div id="o-messages" class="message-list"></div>
      </section>

      <section class="card stack">
        <h2 class="section-title">訂單明細</h2>
        <div id="o-lines"></div>
        <div class="summary-row summary-row--total"><span>總金額</span><span id="o-total"></span></div>
        <div id="o-time" class="muted text-xs"></div>
      </section>

      <div class="stack">
        <button id="o-cancel" class="btn btn--danger btn--block" type="button" hidden>
          <span class="material-symbols-rounded icon icon--sm" aria-hidden="true">cancel</span>
          取消訂單
        </button>
        <a id="o-again" class="btn btn--primary btn--block" href="index.html" hidden>
          <span class="material-symbols-rounded icon" aria-hidden="true">restaurant</span>
          再點一次
        </a>
        <button id="o-sound" class="btn btn--ghost btn--block" type="button">
          <span class="material-symbols-rounded icon" aria-hidden="true">volume_up</span>
          測試提示音
        </button>
      </div>
    </section>
  </main>
</body>
</html>
