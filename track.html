<!doctype html>
<html lang="zh-Hant-TW" data-i18n-page="on" data-i18n-title="track.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,add_photo_alternate,arrow_back_ios_new,arrow_downward,arrow_upward,block,campaign,cancel,chat,check,chevron_left,chevron_right,close,content_copy,delete,done_all,download,edit,error,expand_more,fullscreen,group,image,inbox,info,language,link_off,login,logout,near_me,notifications,notifications_active,notifications_off,payments,person_add,point_of_sale,print,progress_activity,qr_code_2,receipt_long,remove,restart_alt,restaurant,restaurant_menu,save,schedule,search,send,settings,shopping_bag,sms,storefront,tune,tv,undo,upload,view_kanban,visibility,volume_up,warning,zoom_in,zoom_out&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/core/page-wait-boot.js"></script>
<title>九愛！買｜訂單進度</title>
<script type="module" src="js/pages/track.js"></script>
</head>
<body>
  <header class="topbar topbar--fixed">
    <div class="topbar__inner">
      <img class="topbar__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
      <span class="topbar__spacer"></span>
      <!-- 訂單進行中不顯示返回；訂單結束或在找回訂單畫面才顯示 -->
      <a id="back-btn" class="btn btn--ghost btn--icon" href="index.html" aria-label="回到首頁" data-i18n-aria="common.backHome" hidden>
        <span class="material-symbols-rounded icon" aria-hidden="true">arrow_back_ios_new</span>
      </a>
    </div>
  </header>

  <!-- 可取餐提醒列：按「我知道了」後關閉 -->
  <div id="ready-bar" class="ready-bar" role="alert" hidden>
    <div class="ready-bar__inner">
      <span class="material-symbols-rounded icon" aria-hidden="true">notifications_active</span>
      <strong id="ready-bar-text" class="ready-bar__text"></strong>
      <button id="ready-ack" type="button" class="btn btn--sm ready-bar__btn press" data-i18n="track.ack">我知道了</button>
    </div>
  </div>

  <main class="page stack">
    <section id="state-loading" class="loading">
      <span class="material-symbols-rounded icon spin" aria-hidden="true">progress_activity</span>
      <span data-i18n="common.loading">載入中</span>
    </section>

    <!-- 找回訂單 -->
    <section id="view-find" class="stack flush" hidden>
      <form id="find-form" class="card stack">
        <h2 class="section-title" data-i18n="track.findTitle">找回訂單</h2>
        <label class="field">
          <span class="field__label" data-i18n="track.orderNo">訂單編號</span>
          <input class="input" name="no" required maxlength="6" placeholder="例如：A012" data-i18n-placeholder="track.orderNoPh" autocapitalize="characters">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="track.findPhone">下單時填寫的手機號碼</span>
          <input class="input" name="phone" type="tel" inputmode="numeric" required maxlength="12" placeholder="09xxxxxxxx">
        </label>
        <p id="find-error" class="banner banner--danger" hidden></p>
        <button class="btn btn--primary btn--block" type="submit">
          <span class="material-symbols-rounded icon" aria-hidden="true">search</span>
          <span data-i18n="track.search">查詢</span>
        </button>
      </form>
      <section id="history" class="card stack" hidden>
        <h2 class="section-title" data-i18n="track.deviceOrders">這台裝置的訂單</h2>
        <div id="history-list" class="stack"></div>
      </section>
    </section>

    <!-- 訂單進度 -->
    <section id="view-order" class="stack flush" hidden>
      <ol id="o-steps" class="steps" aria-label="訂單進度" data-i18n-aria="track.heading"></ol>

      <div id="o-hero" class="card order-hero">
        <p class="muted" data-i18n="track.orderNo">訂單編號</p>
        <p id="o-no" class="display-no order-hero__no"></p>
        <p id="o-status" class="order-hero__status"></p>
        <p id="o-eta" class="muted"></p>
      </div>

      <div id="o-alert"></div>

      <section id="o-notify" class="card stack" hidden></section>

      <!-- 引導我去攤位 -->
      <section id="o-guide" class="card guide" hidden>
        <button id="guide-toggle" type="button" class="guide__toggle" aria-expanded="false" aria-controls="guide-body">
          <span class="material-symbols-rounded icon" aria-hidden="true">near_me</span>
          <span class="guide__label" data-i18n="guide.button">引導我去攤位</span>
          <span class="material-symbols-rounded icon guide__chevron" aria-hidden="true">expand_more</span>
        </button>
        <div id="guide-body" class="guide__body" hidden></div>
      </section>

      <section id="o-messages-box" class="card stack" hidden>
        <h2 class="section-title" data-i18n="track.messagesTitle">攤位訊息</h2>
        <div id="o-messages" class="message-list"></div>
      </section>

      <section class="card stack">
        <h2 class="section-title" data-i18n="track.detailsTitle">訂單明細</h2>
        <div id="o-lines"></div>
        <div class="summary-row summary-row--total"><span data-i18n="order.total">總金額</span><span id="o-total"></span></div>
        <div id="o-time" class="muted text-xs"></div>
      </section>

      <div class="stack">
        <button id="o-cancel" class="btn btn--danger btn--block" type="button" hidden>
          <span class="material-symbols-rounded icon icon--sm" aria-hidden="true">cancel</span>
          <span data-i18n="track.cancelBtn">取消訂單</span>
        </button>
        <a id="o-again" class="btn btn--primary btn--block" href="index.html" hidden>
          <span class="material-symbols-rounded icon" aria-hidden="true">restaurant</span>
          <span data-i18n="track.again">再點一次</span>
        </a>
        <button id="o-sound" class="btn btn--ghost btn--block" type="button">
          <span class="material-symbols-rounded icon" aria-hidden="true">volume_up</span>
          <span data-i18n="track.testSound">測試提示音</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
