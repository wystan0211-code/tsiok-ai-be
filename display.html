<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back,arrow_downward,arrow_upward,block,campaign,cancel,chat,check,delete,done_all,download,edit,error,fullscreen,group,image,inbox,info,link_off,login,logout,notifications,notifications_active,payments,person_add,point_of_sale,print,receipt_long,remove,restart_alt,restaurant,restaurant_menu,save,schedule,search,send,settings,shopping_bag,sms,storefront,tune,tv,undo,view_kanban,volume_up,warning&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<meta name="robots" content="noindex">
<title>九愛！買｜叫號</title>
<script type="module" src="js/pages/display.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <img class="topbar__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
      <span class="topbar__title">取餐叫號</span>
      <span class="topbar__spacer"></span>
      <span id="clock" class="muted"></span>
      <button id="fullscreen" class="btn btn--ghost btn--icon" type="button" aria-label="全螢幕" title="全螢幕">
        <span class="material-symbols-rounded icon" aria-hidden="true">fullscreen</span>
      </button>
    </div>
  </header>
  <main class="display">
    <section class="display__col" aria-live="polite">
      <h1 class="display__title">製作中</h1>
      <div id="making" class="display__nos display-no"></div>
    </section>
    <section class="display__col display__col--ready" aria-live="assertive">
      <h1 class="display__title">請取餐</h1>
      <div id="ready" class="display__nos display-no"></div>
    </section>
  </main>
</body>
</html>
