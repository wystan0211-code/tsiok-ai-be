<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,add_photo_alternate,arrow_back_ios_new,arrow_downward,arrow_upward,block,campaign,cancel,cast,cast_connected,cast_pause,cast_warning,chat,check,check_circle,chevron_left,chevron_right,close,content_copy,delete,done_all,download,edit,error,event,expand_more,fullscreen,group,history,image,inbox,info,inventory_2,language,link_off,login,logout,near_me,notifications,notifications_active,notifications_off,payments,person_add,point_of_sale,print,progress_activity,qr_code_2,receipt_long,remove,restart_alt,restaurant,restaurant_menu,restore,save,schedule,search,send,settings,shopping_bag,sms,storefront,swap_horiz,sync,timer,tune,tv,undo,upload,view_kanban,visibility,volume_up,warning,zoom_in,zoom_out&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<meta name="robots" content="noindex">
<title>九愛！買｜攤位營運</title>
<script type="module" src="js/pages/stall.js"></script>
</head>
<body class="has-tabbar">
  <header class="topbar">
    <div class="topbar__inner">
      <img class="topbar__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
      <span class="topbar__title stall-title">營運</span>
      <span class="topbar__spacer"></span>
      <!-- 平台模式三段滑鈕：關閉 / 預購 / 點餐(只有攤位主管與管理員可以切換) -->
      <div id="mode-switch" class="mode-switch" role="radiogroup" aria-label="平台模式">
        <span class="mode-switch__thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-order-mode="off" aria-label="關閉" title="關閉">
          <span class="material-symbols-rounded icon" aria-hidden="true">block</span></button>
        <button type="button" role="radio" data-order-mode="presale" aria-label="預購" title="預購">
          <span class="material-symbols-rounded icon" aria-hidden="true">event</span></button>
        <button type="button" role="radio" data-order-mode="open" aria-label="點餐" title="點餐">
          <span class="material-symbols-rounded icon" aria-hidden="true">check_circle</span></button>
      </div>
      <a class="btn btn--ghost btn--icon" href="display.html" target="_blank" rel="noopener" aria-label="開啟叫號畫面" title="叫號畫面">
        <span class="material-symbols-rounded icon" aria-hidden="true">tv</span>
      </a>
      <a id="admin-link" class="btn btn--ghost btn--icon" href="admin.html" aria-label="管理後台" title="管理後台" hidden>
        <span class="material-symbols-rounded icon" aria-hidden="true">settings</span>
      </a>
      <button id="logout" class="btn btn--ghost btn--icon" type="button" aria-label="登出" title="登出">
        <span class="material-symbols-rounded icon" aria-hidden="true">logout</span>
      </button>
    </div>
  </header>

  <main class="page page--wide stack">
    <p id="who" class="muted text-sm"></p>
    <!-- 預購主管：付款期限(全站設定，1～48 小時；管理員在後台設定頁調整) -->
    <form id="presale-tools" class="presale-tools" hidden>
      <span class="text-sm">預購付款期限</span>
      <input class="input" name="hours" type="number" min="1" max="48" step="1" inputmode="numeric" aria-label="預購付款期限(小時)">
      <span class="text-sm">小時</span>
      <button class="btn btn--sm" type="submit">儲存</button>
    </form>

    <nav class="tabs tabs--bar" role="tablist" aria-label="營運功能">
      <span class="tabs__indicator" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="board" aria-selected="true">
        <span class="material-symbols-rounded icon" aria-hidden="true">view_kanban</span><span class="tab__label" data-label="看板">看板</span>
        <span id="pending-count" class="count-dot is-empty">0</span>
      </button>
      <button class="tab" role="tab" data-tab="pos" aria-selected="false">
        <span class="material-symbols-rounded icon" aria-hidden="true">point_of_sale</span><span class="tab__label" data-label="現場點餐">現場點餐</span>
      </button>
      <button class="tab" role="tab" data-tab="inbox" aria-selected="false">
        <span class="material-symbols-rounded icon" aria-hidden="true">inbox</span><span class="tab__label" data-label="收件匣">收件匣</span>
        <span id="inbox-count" class="count-dot is-empty">0</span>
      </button>
      <button class="tab" role="tab" data-tab="pickup" aria-selected="false">
        <span class="material-symbols-rounded icon" aria-hidden="true">search</span><span class="tab__label" data-label="取餐核對">取餐核對</span>
      </button>
    </nav>

    <!-- 看板 -->
    <section id="panel-board" role="tabpanel" class="stack">
      <div class="segmented board__mobile-switch" role="group" aria-label="切換欄位">
        <button type="button" data-col="pending" aria-pressed="true">新訂單 <span data-count="pending"></span></button>
        <button type="button" data-col="accepted" aria-pressed="false">製作中 <span data-count="accepted"></span></button>
        <button type="button" data-col="ready" aria-pressed="false">可取餐 <span data-count="ready"></span></button>
        <button type="button" data-col="done" aria-pressed="false">已結束 <span data-count="done"></span></button>
      </div>
      <div class="board">
        <div class="board__col is-shown" data-colbox="pending">
          <h2 class="board__head">新訂單 <span class="count-dot" data-count="pending"></span></h2>
          <div class="stack" data-list="pending"></div>
        </div>
        <div class="board__col" data-colbox="accepted">
          <h2 class="board__head">製作中 <span class="count-dot" data-count="accepted"></span></h2>
          <div class="stack" data-list="accepted"></div>
        </div>
        <div class="board__col" data-colbox="ready">
          <h2 class="board__head">可取餐 <span class="count-dot" data-count="ready"></span></h2>
          <div class="stack" data-list="ready"></div>
        </div>
        <div class="board__col" data-colbox="done">
          <h2 class="board__head">今日已結束 <span class="count-dot" data-count="done"></span></h2>
          <div class="stack" data-list="done"></div>
        </div>
      </div>
      <!-- 逾時作廢的預購單：預購主管與管理員看全部，攤位主管只看現場建立的；可以復原並重新給付款期限 -->
      <details id="void-box" class="card void-box" hidden>
        <summary class="void-box__head">
          <span class="material-symbols-rounded icon" aria-hidden="true">history</span>
          <span>逾時作廢的預購單</span>
          <span id="void-count" class="count-dot">0</span>
        </summary>
        <div class="stack void-box__body">
          <input id="void-q" class="input" type="search" placeholder="搜尋編號或電話後 4 碼" aria-label="搜尋逾時作廢的預購單">
          <div id="void-list" class="stack"></div>
        </div>
      </details>
    </section>

    <!-- 現場點餐 -->
    <section id="panel-pos" role="tabpanel" hidden>
      <!-- 顧客顯示頁連線狀態：綠色已連線、淺紅底已離線 -->
      <div id="screen-bar" class="screen-bar" hidden>
        <span id="screen-bar-icon" class="material-symbols-rounded icon" aria-hidden="true">cast_connected</span>
        <span id="screen-bar-text" class="screen-bar__text"></span>
        <!-- 顧客顯示頁沒有點餐時要顯示輪播還是叫號(顧客顯示頁左下角的按鈕也可以切換) -->
        <div class="screen-view" role="group" aria-label="顧客顯示頁待機畫面">
          <button type="button" data-screen-view="carousel" aria-pressed="true">輪播</button>
          <button type="button" data-screen-view="board" aria-pressed="false">叫號</button>
        </div>
        <button id="screen-unpair" class="btn btn--sm" type="button">解除連線</button>
      </div>
      <div class="pos">
        <div id="pos-grid" class="pos-grid"></div>
        <form id="pos-form" class="card stack" novalidate>
          <div class="row pos-head">
            <h2 class="section-title">現場訂單</h2>
            <span class="topbar__spacer"></span>
            <!-- 顧客顯示頁的語言(攤位這邊一律中文) -->
            <div class="pos-lang">
              <button id="screen-lang-btn" class="btn btn--ghost btn--icon" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="screen-lang-menu" aria-label="顧客顯示頁語言" title="顧客顯示頁語言">
                <span class="material-symbols-rounded icon" aria-hidden="true">language</span>
              </button>
              <div id="screen-lang-menu" class="lang-menu pos-lang__menu" hidden>
                <button type="button" class="lang-menu__item" data-screen-lang="zh-Hant"><span>繁體中文</span><span class="material-symbols-rounded icon icon--sm lang-menu__check" aria-hidden="true">check</span></button>
                <button type="button" class="lang-menu__item" data-screen-lang="en" lang="en"><span>English</span><span class="material-symbols-rounded icon icon--sm lang-menu__check" aria-hidden="true">check</span></button>
                <button type="button" class="lang-menu__item" data-screen-lang="ja" lang="ja"><span>日本語</span><span class="material-symbols-rounded icon icon--sm lang-menu__check" aria-hidden="true">check</span></button>
              </div>
            </div>
            <!-- 顧客顯示頁配對 -->
            <button id="screen-btn" class="btn btn--ghost btn--icon" type="button" aria-label="顧客顯示頁" title="顧客顯示頁">
              <span id="screen-btn-icon" class="material-symbols-rounded icon" aria-hidden="true">cast</span>
            </button>
          </div>
          <div id="pos-lines"></div>
          <div class="summary-row summary-row--total"><span>合計</span><span id="pos-total">NT$ 0</span></div>
          <div class="segmented" role="group" aria-label="取餐方式">
            <button type="button" data-mode="now" aria-pressed="true">立即取餐</button>
            <button type="button" data-mode="later" aria-pressed="false">稍後取餐</button>
            <!-- 攤位主管與管理員可以在現場建立預購單(C)，不受平台模式限制 -->
            <button type="button" data-mode="presale" aria-pressed="false" hidden>預購</button>
          </div>
          <fieldset class="field" style="border:none;padding:0;margin:0">
            <legend class="field__label">付款方式</legend>
            <div id="pos-payment" class="radio-group"></div>
          </fieldset>
          <div id="pos-later-fields" class="stack" hidden>
            <div class="name-row">
              <label class="field">
                <span class="field__label">姓氏(選填)</span>
                <input class="input input--surname" name="surname" maxlength="10">
              </label>
              <fieldset class="name-row__title">
                <legend class="visually-hidden">稱謂</legend>
                <div class="radio-group">
                <label class="radio-chip"><input type="radio" name="title" value="先生"><span>先生</span></label>
                <label class="radio-chip"><input type="radio" name="title" value="小姐"><span>小姐</span></label>
                <label class="radio-chip"><input type="radio" name="title" value="其他"><span>其他</span></label>
                </div>
              </fieldset>
            </div>
            <label class="field">
              <span class="field__label">手機號碼(選填，可用簡訊通知)</span>
              <input class="input" name="phone" type="tel" inputmode="numeric" maxlength="12" placeholder="09xxxxxxxx">
            </label>
          </div>
          <!-- 現場預購：送出後是「請付款」的 C 單，標示已付款時才選付款方式 -->
          <div id="pos-presale-fields" class="stack" hidden>
            <p class="muted text-sm">送出後是一張「請付款」的預購單，收款後在看板按「標示已付款」才會成立。</p>
            <div class="name-row">
              <label class="field">
                <span class="field__label">全名</span>
                <input class="input input--fullname" name="pFullName" maxlength="10" autocomplete="off">
              </label>
              <fieldset class="name-row__title">
                <legend class="visually-hidden">稱謂</legend>
                <div id="pos-ptitle" class="radio-group"></div>
              </fieldset>
            </div>
            <label id="pos-pclass-field" class="field" hidden>
              <span class="field__label">班級</span>
              <select class="select" name="pClass"></select>
            </label>
            <label class="field">
              <span class="field__label">手機號碼(選填，可用簡訊通知)</span>
              <input class="input" name="pPhone" type="tel" inputmode="numeric" maxlength="12" placeholder="09xxxxxxxx">
            </label>
            <label class="field">
              <span class="field__label">取餐時段</span>
              <select class="select" name="pSlot"></select>
            </label>
          </div>
          <p id="pos-error" class="banner banner--danger" hidden></p>
          <div class="row">
            <button id="pos-submit" class="btn btn--primary btn--lg" type="submit" style="flex:1">
              <span class="material-symbols-rounded icon" aria-hidden="true">payments</span>
              <span id="pos-submit-text">結帳記帳</span>
            </button>
            <!-- 清空放在結帳記帳右邊 -->
            <button id="pos-clear" class="btn btn--ghost" type="button">清空</button>
          </div>
        </form>
      </div>
    </section>

    <!-- 收件匣 -->
    <section id="panel-inbox" role="tabpanel" class="stack" hidden>
      <p class="muted text-sm">顧客預點超過單筆上限時，系統會自動拒絕並在這裡通知。顧客可能會直接到攤位點餐。</p>
      <div id="inbox-list" class="stack"></div>
    </section>

    <!-- 取餐核對 -->
    <section id="panel-pickup" role="tabpanel" class="stack" hidden>
      <div class="card stack">
        <div class="segmented" role="group" aria-label="查詢方式">
          <button type="button" data-find="no" aria-pressed="true">訂單編號</button>
          <button type="button" data-find="phone" aria-pressed="false">電話末三碼</button>
        </div>
        <input id="pickup-q" class="input" inputmode="text" placeholder="輸入 A012、12 或電話末三碼" aria-label="查詢">
      </div>
      <div id="pickup-results" class="stack"></div>
    </section>
  </main>
</body>
</html>
