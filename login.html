<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九愛！買">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back_ios_new,arrow_downward,arrow_upward,block,campaign,cancel,chat,check,delete,done_all,download,edit,error,fullscreen,group,image,inbox,info,link_off,login,logout,notifications,notifications_active,payments,person_add,point_of_sale,print,progress_activity,receipt_long,remove,restart_alt,restaurant,restaurant_menu,save,schedule,search,send,settings,shopping_bag,sms,storefront,tune,tv,undo,view_kanban,volume_up,warning&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<meta name="robots" content="noindex">
<title>九愛！買｜員工登入</title>
<script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <main class="page stack" style="max-width:420px">
    <section class="hero">
      <img class="hero__logo" src="assets/brand/logo-horizontal.png" alt="九愛！買" width="640" height="260">
      <h1>員工登入</h1>
    </section>
    <form id="login-form" class="card stack">
      <label class="field">
        <span class="field__label">帳號</span>
        <input class="input" name="username" autocomplete="username" autocapitalize="none" required>
      </label>
      <label class="field">
        <span class="field__label">密碼</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="banner banner--danger" hidden></p>
      <button class="btn btn--primary btn--lg btn--block" type="submit">
        <span class="material-symbols-rounded icon" aria-hidden="true">login</span>
        登入
      </button>
    </form>
    <p id="demo-accounts" class="card muted text-sm" hidden>
      展示模式帳號：管理員 admin / admin1234、攤位主管 manager / manager1234、店員 staff / staff1234
    </p>
  </main>
</body>
</html>
